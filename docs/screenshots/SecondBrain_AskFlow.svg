<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Second Brain ask flow — grounded recall</title>
  <desc>User asks a question, HydraDB returns top 6 memory chunks with scores, OpenAI generates an answer strictly from those chunks, and sources are cited in the response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="360" fill="#FDF6EE" rx="12"/>

  <text font-family="Georgia, serif" font-size="13" fill="#0C447C" x="340" y="36" text-anchor="middle" font-weight="700">Ask flow — grounded recall</text>

  <!-- User question -->
  <rect x="30" y="60" width="110" height="52" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="0.5"/>
  <text font-family="Georgia, serif" font-size="11" fill="#712B13" x="85" y="80" text-anchor="middle" font-weight="600">User asks</text>
  <text font-family="Georgia, serif" font-size="9" fill="#854F0B" x="85" y="98" text-anchor="middle">plain language</text>

  <line x1="140" y1="86" x2="178" y2="86" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- POST /api/ask -->
  <rect x="180" y="60" width="130" height="52" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="0.5"/>
  <text font-family="Georgia, serif" font-size="11" fill="#712B13" x="245" y="78" text-anchor="middle" font-weight="600">POST /api/ask</text>
  <text font-family="Georgia, serif" font-size="9" fill="#993C1D" x="245" y="96" text-anchor="middle">{ question: string }</text>

  <line x1="310" y1="86" x2="348" y2="86" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- recallPreferences -->
  <rect x="350" y="60" width="140" height="52" rx="10" fill="#E8F3EC" stroke="#3B6D11" stroke-width="0.5"/>
  <text font-family="Georgia, serif" font-size="10" fill="#27500A" x="420" y="78" text-anchor="middle" font-weight="600">recallPreferences()</text>
  <text font-family="Georgia, serif" font-size="9" fill="#3B6D11" x="420" y="94" text-anchor="middle">max_results: 6</text>
  <text font-family="Georgia, serif" font-size="9" fill="#3B6D11" x="420" y="108" text-anchor="middle">mode: fast</text>

  <line x1="490" y1="86" x2="528" y2="86" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- HydraDB -->
  <rect x="530" y="60" width="110" height="52" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text font-family="Georgia, serif" font-size="11" fill="#27500A" x="585" y="80" text-anchor="middle" font-weight="600">HydraDB</text>
  <text font-family="Georgia, serif" font-size="9" fill="#3B6D11" x="585" y="98" text-anchor="middle">semantic search</text>

  <!-- Chunks returned -->
  <line x1="585" y1="112" x2="585" y2="148" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>
  <text font-family="Georgia, serif" font-size="9" fill="#27500A" x="600" y="134" font-style="italic">top 6 chunks + scores</text>

  <!-- Chunks display -->
  <rect x="460" y="150" width="180" height="88" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text font-family="Georgia, serif" font-size="10" fill="#27500A" x="550" y="170" text-anchor="middle" font-weight="600">Retrieved chunks</text>
  <rect x="472" y="178" width="156" height="16" rx="4" fill="#C0DD97" stroke="none"/>
  <text font-family="Georgia, serif" font-size="8" fill="#27500A" x="550" y="190" text-anchor="middle">chunk 1 · score 0.94</text>
  <rect x="472" y="198" width="130" height="16" rx="4" fill="#C0DD97" stroke="none" opacity="0.7"/>
  <text font-family="Georgia, serif" font-size="8" fill="#27500A" x="550" y="210" text-anchor="middle">chunk 2 · score 0.81</text>
  <rect x="472" y="218" width="100" height="16" rx="4" fill="#C0DD97" stroke="none" opacity="0.4"/>
  <text font-family="Georgia, serif" font-size="8" fill="#27500A" x="550" y="230" text-anchor="middle">chunk 3 · score 0.67</text>

  <!-- Arrow chunks → grounding box -->
  <line x1="460" y1="194" x2="402" y2="194" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Grounding constraint box -->
  <rect x="180" y="158" width="220" height="100" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text font-family="Georgia, serif" font-size="10" fill="#0C447C" x="290" y="178" text-anchor="middle" font-weight="700">Grounding constraint</text>
  <text font-family="Georgia, serif" font-size="9" fill="#185FA5" x="290" y="196" text-anchor="middle">system prompt:</text>
  <text font-family="Georgia, serif" font-size="9" fill="#0C447C" x="290" y="212" text-anchor="middle" font-style="italic">"Answer ONLY from these</text>
  <text font-family="Georgia, serif" font-size="9" fill="#0C447C" x="290" y="226" text-anchor="middle" font-style="italic">memories. Do not invent."</text>
  <text font-family="Georgia, serif" font-size="9" fill="#185FA5" x="290" y="244" text-anchor="middle">temperature: 0.2</text>

  <!-- Arrow grounding → OpenAI -->
  <line x1="290" y1="258" x2="290" y2="292" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- OpenAI -->
  <rect x="180" y="294" width="220" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text font-family="Georgia, serif" font-size="11" fill="#0C447C" x="290" y="314" text-anchor="middle" font-weight="600">gpt-4o-mini</text>
  <text font-family="Georgia, serif" font-size="9" fill="#185FA5" x="290" y="330" text-anchor="middle">generates grounded answer</text>

  <!-- Arrow OpenAI → response -->
  <line x1="180" y1="316" x2="142" y2="316" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Response -->
  <rect x="30" y="294" width="110" height="44" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="0.5"/>
  <text font-family="Georgia, serif" font-size="10" fill="#712B13" x="85" y="314" text-anchor="middle" font-weight="600">Answer</text>
  <text font-family="Georgia, serif" font-size="9" fill="#993C1D" x="85" y="330" text-anchor="middle">+ cited sources</text>

  <!-- No hallucination note -->
  <text font-family="Georgia, serif" font-size="9" fill="#185FA5" x="550" y="268" text-anchor="middle" font-style="italic">no relevant memory?</text>
  <text font-family="Georgia, serif" font-size="9" fill="#185FA5" x="550" y="282" text-anchor="middle" font-style="italic">"I don't have that" — no hallucination</text>
</svg>
